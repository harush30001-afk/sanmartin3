<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לובי קומתי · ארונות הפירים</title>
<style>
:root{--bg:#eceee9;--card:#fff;--fg:#1f2328;--mu:#5d625e;--line:#d8dcd5;--acc:#2d5e4a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 "Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{display:flex;flex-direction:column;height:100%}
#st{position:relative;flex:1;min-height:320px;overflow:hidden;touch-action:none;background:#d9dcdc}
#st canvas{display:block;width:100%;height:100%}
.top{position:absolute;inset:10px 10px auto 10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.94);font:700 14px inherit;color:var(--fg)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.zm{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zm button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.94);font:800 20px inherit}
#inf{background:var(--card);border-top:1px solid var(--line);padding:10px 14px 14px;max-height:42%;overflow:auto}
#inf b.t{font-size:16px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tags i{font-style:normal;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:#e6f1e9;color:#2f6b43}
.mu{color:var(--mu);font-size:13px}
.hint{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 10px;font-size:13px;max-width:60%}
/* 854: מגירת גימור מתקפלת עם עיגולי צבע, זום בצביטה, הסבר שנעלם לבד */
#zi,#zo{display:none}
.zm{top:10px;left:10px;bottom:auto}
.sheet{position:absolute;inset:auto 10px 10px 10px;z-index:5;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.16)}
.sheet>button.sh{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-weight:700;font-size:14.5px;cursor:pointer;min-height:44px}
.sheet>button.sh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:-4px;margin-inline-end:6px}
.sheet>button.sh .ar{transition:transform .2s}
.sheet[data-open="0"]>button.sh .ar{transform:rotate(180deg)}
.sheet .bd{padding:0 14px 12px;display:grid;gap:8px}
.sheet[data-open="0"] .bd{display:none}
.sheet .lb{font-size:12.5px;color:var(--mu);font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px;border-radius:12px;font:500 11.5px inherit;color:var(--fg);cursor:pointer;min-width:44px}
.sw button i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.hint{right:50%;transform:translateX(50%);top:58px;bottom:auto;max-width:80%;text-align:center;background:rgba(20,23,28,.84);color:#fff;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}
</style></head><body>
