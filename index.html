html:is([data-theme=light],[data-theme=gray],[data-theme=cream],[data-theme=tech]) body{background:#eef1f6;background-image:none}
html:is([data-theme=light],[data-theme=gray],[data-theme=cream],[data-theme=tech]) body::before{background:#eef1f6}
html[data-theme=glass]{--card:rgba(255,255,255,.52);--bd:rgba(255,255,255,.75)}
html[data-theme=glass] body{background:#e9edf7;background-image:radial-gradient(520px 420px at 8% 4%,rgba(255,176,120,.55),transparent 70%),radial-gradient(560px 480px at 96% 22%,rgba(120,190,255,.5),transparent 70%),radial-gradient(520px 520px at 30% 96%,rgba(170,235,200,.55),transparent 70%),radial-gradient(420px 420px at 90% 92%,rgba(200,170,255,.45),transparent 70%);background-attachment:fixed}
html[data-theme=glass] body::before{background:rgba(255,255,255,.35);backdrop-filter:blur(20px)}
html:is([data-theme=light],[data-theme=gray],[data-theme=cream],[data-theme=tech]) header,html[data-theme=glass] header{background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(15,27,51,.08)}
