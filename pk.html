<style>
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

/* אותה שפה כמו סקיצה 155: הדמיה למעלה, שלבים מתחת. צבעי YH */
:root{
  --bg:#eceee9; --card:#ffffff; --fg:#1f2328; --mu:#5d625e; --line:#d8dcd5;
  --acc:#2d5e4a; --acc-in:#ffffff; --chip:#f4f5f1; --q:#fff6df; --qb:#ecd391; --scene:#dfe2dc;
  --f:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --card:#1b201d; --fg:#e8ebe7; --mu:#a3aaa4; --line:#2c332f; --acc:#5fa585; --acc-in:#0d1411; --chip:#232925; --q:#2b2617; --qb:#5c4f25; --scene:#1e2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --card:#1b201d; --fg:#e8ebe7; --mu:#a3aaa4; --line:#2c332f; --acc:#5fa585; --acc-in:#0d1411; --chip:#232925; --q:#2b2617; --qb:#5c4f25; --scene:#1e2421; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--f);direction:rtl;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.w{max-width:820px;margin:0 auto;display:grid;gap:12px}
h1{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
.mu{color:var(--mu);font-size:13.5px}
.stage3d{position:relative;border-radius:18px;overflow:hidden;background:var(--scene);height:min(66vh,580px);min-height:380px;touch-action:none}
.stage3d canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:10px 10px auto 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud .col{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{pointer-events:auto;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
button.tg{pointer-events:auto;font:700 13.5px var(--f);min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.tg.on{background:var(--acc);color:var(--acc-in);border-color:var(--acc)}
button.tg[hidden]{display:none}
.nav{position:absolute;inset:auto 10px 10px 10px;display:flex;gap:8px;align-items:center}
.nav button{flex:none;min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:800 20px var(--f);cursor:pointer}
.nav .cap{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px;line-height:1.35}
.nav .cap b{display:block;font-size:15px}
.joy{position:absolute;left:14px;bottom:80px;width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--card) 55%,transparent);border:1.5px solid color-mix(in srgb,var(--fg) 25%,transparent);touch-action:none;z-index:3}.joy[hidden]{display:none}.joy .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.zm{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:6px;z-index:3}.zm[hidden]{display:none}.zm button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--fg);font:800 20px var(--f);touch-action:manipulation}
.pick{position:absolute;inset:auto 10px 74px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.pick[hidden]{display:none}
.pick b{display:block;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.say{gap:2px;font-size:14.5px}
.lbl{font-size:12.5px;font-weight:700;color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.ch{font:600 14px var(--f);min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}button.ch.on{background:var(--acc);color:var(--acc-in);border-color:var(--acc)}

.steps button{text-align:right;display:flex;gap:8px;align-items:center;min-height:44px;padding:5px 9px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:600 13.5px var(--f);cursor:pointer}
.steps button .n{flex:none;font:700 11.5px var(--f);min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:var(--line);color:var(--fg)}

.steps button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.steps button.on .n{background:var(--acc);color:var(--acc-in)}
.ph{grid-column:1/-1;font:800 12.5px var(--f);color:var(--mu);margin-top:4px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:8px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.q{background:var(--q);border-color:var(--qb)}
.q ol{margin:2px 0;padding-inline-start:20px}.q li{margin:3px 0}
#st::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(10,14,18,.2) 100%);z-index:1}
</style>

<div class="w">
  <div>
    <h1 id="pkh">הדמיית חניון</h1>
    <div class="mu">השלב של כל קומה נשמר במערכת לכולם. מעבירים שלב בחצים או ברשימה, ובוחרים קומה למטה.</div>
  </div>
  <div class="stage3d" id="st">
    <div class="hud"><span class="pill" id="hudStage"></span><div class="col"><button class="tg" id="walkBtn" type="button">הליכה בחניון</button><button class="tg" id="spotBtn" type="button" hidden>למקום הבא</button><button class="tg" id="xrWBtn" type="button" hidden>רנטגן</button><button class="tg" id="dimBtn" type="button">מידות</button><button class="tg" id="ceilBtn" type="button">תקרה: מוסתרת</button><button class="tg" id="ownBtn" type="button">מי חונה איפה</button><button class="tg" id="allBtn" type="button">כל הקומות</button></div></div>
    <div class="pick" id="pick" hidden></div>
    <div class="zm" id="zm"><button type="button" data-z="in" aria-label="קרוב">+</button><button type="button" data-z="out" aria-label="רחוק">−</button><button type="button" data-z="home" aria-label="מבט כללי">⌂</button></div>
    <div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
    <div class="nav"><button type="button" id="prev" aria-label="שלב קודם">›</button><div style="position:relative;flex:1;min-width:0;display:flex"><div class="cap" id="cap"></div><select id="stSel" aria-label="קפיצה לשלב" style="position:absolute;opacity:0;inset:0;width:100%;height:100%;font-size:16px"></select><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55;font-size:13px;pointer-events:none">▾</span></div><button type="button" id="next" aria-label="שלב הבא">‹</button></div>
  </div>
  <div class="card say" id="say"></div>
  <div class="card">
    <div class="row" id="lvl"><span class="lbl">קומה:</span><button class="ch on" data-l="1">‎-1</button><button class="ch" data-l="2">‎-2</button><button class="ch" data-l="3">‎-3</button></div>
    <div class="row" id="flr"><span class="lbl">רצפה:</span><button class="ch on" data-f="heli">בטון מוחלק + מספור</button><button class="ch" data-f="epoxy">אפוקסי + פס אגזוזים</button></div>
    <div class="row" id="clad"><span class="lbl">חיפוי בכניסה:</span><button class="ch on" data-c="stone">אבן</button><button class="ch" data-c="alu">אלומיניום</button></div>
    <div class="mu">אפשר ללחוץ על דלתות, על השער, על המחסום, על המפוחים ועל המשאבות כדי להפעיל אותם.</div>
  </div>
  <div class="card"><div class="legend" id="legend"></div></div>
  <div class="card"><div class="lbl">שלבי החניון</div><div class="steps" id="steps"></div></div>
  
</div>
